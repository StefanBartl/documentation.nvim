# Four jobs rather than one `scripts/ci.sh`, deliberately: they run in
# parallel and each keeps its own red/green mark, which is what a CI matrix is
# for. But WHAT each gate is lives in `scripts/ci.sh` and nowhere else — a
# workflow spelling the commands out again would be a second copy of them, and
# a second copy that drifts is what this repository exists to detect. Run all
# four locally with `scripts/ci.sh`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The one gate that does not go through `scripts/ci.sh`: this action is
      # the installer AND the runner, so there is no binary on PATH to hand
      # the script. `args` must therefore stay identical to what
      # `run_stylua` does — the whole tree, not a list of directories.
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PUC Lua, not "luajit-2.1": that value fails with a 404 (LuaJIT stopped
      # publishing the 2.1 tarball this action downloads). Which interpreter
      # runs luacheck is independent of what it checks against — `std = "luajit"`
      # in .luacheckrc is what pins that.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      # `scripts/ci.sh` is itself a Neovim Lua script launched via `nvim -l`
      # (see scripts/ci.lua's own header) — that launcher requirement holds
      # for every gate, including this one, even though the luacheck gate's
      # own logic needs nothing Lua 5.4 + luarocks does not already provide.
      # This job never installed Neovim, so `scripts/ci.sh luacheck` failed
      # before ever reaching the actual luacheck run — every push to this
      # repository failed this job for exactly that reason.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: scripts/ci.sh luacheck

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lib.nvim is a runtime dependency: notify, fs, ui.kit, usercmd, map,
      # debounce, autocmd. A headless `-l` run has no plugin manager, so CI
      # provides it the same way a local checkout does — see
      # TESTS/run.lua's `add_lib_nvim`.
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
      # Optional, unlike lib.nvim: `TESTS/browse_endpoints_spec.lua`'s `gs`
      # test already has a real, tested skip path for runtime-analysis.nvim
      # not being installed (this repository's own normal state). Checking
      # it out here upgrades that one assertion block from "the soft
      # dependency degrades correctly" to "the soft dependency actually
      # works end to end" — `TESTS/run.lua` reads `RUNTIME_ANALYSIS_DIR` and
      # appends it to the rtp itself if set, the same way it already does
      # `DOCUMENTATION_TS_PARSERS_DIR` below.
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/runtime-analysis.nvim
          path: .deps/runtime-analysis.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: echo "RUNTIME_ANALYSIS_DIR=$(pwd)/.deps/runtime-analysis.nvim" >> "$GITHUB_ENV"
      # Builds real javascript/typescript/tsx/go grammars from source into
      # .deps/ts-parsers, so the specs that need a parser run their real
      # assertions here instead of their stated skip path — which, before
      # this step existed, was all this job ever exercised. All three grammar
      # repos ship pre-generated `parser.c`, so only `tree-sitter build`
      # (compile), never `tree-sitter generate`, is needed. `TESTS/run.lua`
      # reads `DOCUMENTATION_TS_PARSERS_DIR` and appends it to the rtp itself
      # if set — this step only has to produce the directory and export the
      # variable, not touch the test runner's own invocation.
      #
      # **Go is here for `go_calls_spec.lua`**, which is the only gate on the
      # package-scope resolver — the rule that a bare call may name a
      # function in a *sibling file*, worth nearly half the edges of a real
      # Go call graph. Without the grammar that spec skips silently, and a
      # spec that always skips is not a gate.
      - name: Build JS/TS/TSX/Go treesitter parsers
        run: |
          npm install -g tree-sitter-cli
          mkdir -p .deps/ts-parsers/parser
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-javascript.git /tmp/tree-sitter-javascript
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-typescript.git /tmp/tree-sitter-typescript
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-go.git /tmp/tree-sitter-go
          tree-sitter build --output .deps/ts-parsers/parser/javascript.so /tmp/tree-sitter-javascript
          tree-sitter build --output .deps/ts-parsers/parser/typescript.so /tmp/tree-sitter-typescript/typescript
          tree-sitter build --output .deps/ts-parsers/parser/tsx.so /tmp/tree-sitter-typescript/tsx
          tree-sitter build --output .deps/ts-parsers/parser/go.so /tmp/tree-sitter-go
          echo "DOCUMENTATION_TS_PARSERS_DIR=$(pwd)/.deps/ts-parsers" >> "$GITHUB_ENV"
      - run: scripts/ci.sh tests

  # The drift check this plugin exists to provide, run against its own tree.
  # The pre-commit hook is opt-in per clone (`git config core.hooksPath`), so
  # without this job the committed map goes stale on main with nothing
  # noticing. `--check` regenerates in memory and compares; it writes nothing.
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
      # `.docmap.json` declares lib.nvim's checkout at `../lib.nvim`, and the
      # committed artifact was resolved against it: 20 of this repository's 23
      # external links carry the directory shape (`…/autocmd/init.lua`), which
      # is knowable only by looking at a real checkout — without one,
      # `core/external_repos.lua` falls back to the flat `…/autocmd.lua`. A
      # runner that cannot see the checkout therefore generates a *different*
      # artifact and `--check` calls this repository stale for something the
      # tree never said.
      #
      # That is not a hypothetical this step guards against, it is what this
      # job did: red from 66c429f (2026-08-31) to here, on both index.html and
      # module_map.json, and regenerating the map could not fix it. The two
      # sides differ in exactly 100 bytes, all of them `/init.lua` against
      # `.lua`.
      #
      # A symlink, not a second clone: `actions/checkout` refuses a path
      # outside the workspace, and the `.deps` copy above already exists for
      # `require`. The cost is that a layout change in lib.nvim can turn this
      # job red without a commit here — which is the honest signal, because
      # those links are dead from that moment on.
      - run: ln -s "$PWD/.deps/lib.nvim" ../lib.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: scripts/ci.sh map

  # The only job that runs this repository's code under a Lua that is *not*
  # LuaJIT, which is the entire reason it exists. Every other job runs inside
  # Neovim, so all four stayed green on a tree whose committed map a second
  # Lua would have called stale: LuaJIT renders an integral float as `100`,
  # PUC Lua 5.3+ as `100.0`, and that reached the byte-compared artifact
  # through `core/json.lua` and `core/quicks.lua`. Found by the first real
  # non-Neovim run, not by any gate.
  #
  # The parser-less standalone build, deliberately: `lfs` and `dkjson` are
  # ordinary, reliable rocks, whereas the full-fidelity path needs
  # `lua-tree-sitter`, whose published rock has two packaging defects. Gating
  # `main` on that would be a check that goes red without anyone touching
  # anything — see the advice this project gives adopters in `docs/REUSE.md`.
  # Full byte-parity
  # against a Neovim run stays a local gate.
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luafilesystem && luarocks install dkjson
      # `scripts/ci.sh` is itself launched via `nvim -l`, so this job needs
      # Neovim as the script *host* even though the gate it runs deliberately
      # never uses it as the Lua under test.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: scripts/ci.sh standalone
